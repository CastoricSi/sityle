# Push a tag like v0.2.0 (npm run release:patch|minor|major does it) →
# build the package and attach sityle-<version>.tgz to a GitHub Release.
# Or run it by hand on a branch (Actions → Release → Run workflow) after the
# version commit is pushed: it releases v<package.json version> at that commit
# and creates the tag itself (for when tags can't be pushed).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v$VERSION"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists: bump the version first" >&2
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
            if [ "v$VERSION" != "$TAG" ]; then
              echo "Tag $TAG does not match package.json version $VERSION" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:lib
      - run: npm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/sityle-${VERSION}.tgz"
          gh release create "$TAG" "sityle-${VERSION}.tgz" \
            --target "$GITHUB_SHA" \
            --title "sityle ${TAG}" \
            --generate-notes \
            --notes "Install: \`npm i ${URL}\`"
